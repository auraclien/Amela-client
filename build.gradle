buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.14.10'
    }
}

apply plugin: 'fabric-loom'

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

// гладкий шрифт для меню: качается при сборке (CI тоже умеет)
def fontOutDir = layout.buildDirectory.dir("generated/amelaFont")

tasks.register('downloadMenuFont') {
    def ttf = fontOutDir.map { it.file('assets/amela-client/font/menu.ttf') }
    def license = fontOutDir.map { it.file('assets/amela-client/font/OFL.txt') }
    outputs.files(ttf, license)
    doLast {
        def f = ttf.get().asFile
        f.parentFile.mkdirs()
        if (!f.exists()) {
            new URI('https://raw.githubusercontent.com/JulietaUla/Montserrat/master/fonts/ttf/Montserrat-Medium.ttf')
                    .toURL().withInputStream { ins -> f.withOutputStream { it << ins } }
        }
        def l = license.get().asFile
        if (!l.exists()) {
            new URI('https://raw.githubusercontent.com/JulietaUla/Montserrat/master/OFL.txt')
                    .toURL().withInputStream { ins -> l.withOutputStream { it << ins } }
        }
    }
}

sourceSets { main { resources { srcDir fontOutDir } } }

processResources {
    dependsOn 'downloadMenuFont'
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
